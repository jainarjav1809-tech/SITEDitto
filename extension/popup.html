<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SITEDitto</title>

  <link
    rel="stylesheet"
    href="popup.css"
  >

</head>

<body>

  <div class="container">

    <!-- Header -->

    <div class="header">

      <div class="logo">
        🛡
      </div>

      <div>

        <div class="title">
          SITEDitto
        </div>

        <div class="subtitle">
          LIVE WEBSITE SECURITY
        </div>

      </div>

    </div>


    <!-- Website -->

    <div class="website-box">

      <div class="small-label">
        CURRENT WEBSITE
      </div>

      <div
        id="website"
        class="website"
      >
        Detecting...
      </div>

    </div>


    <!-- Score -->

    <div class="score-section">

      <div
        id="score"
        class="score"
      >
        --
      </div>

      <div
        id="verdict"
        class="verdict"
      >
        ANALYZING
      </div>

    </div>


    <!-- Security Signals -->

    <div class="signals">

      <div class="signal">
        <span>HTTPS</span>
        <span id="https">—</span>
      </div>

      <div class="signal">
        <span>Redirects</span>
        <span id="redirects">—</span>
      </div>

      <div class="signal">
        <span>Credentials</span>
        <span id="credentials">—</span>
      </div>

      <div class="signal">
        <span>Downloads</span>
        <span id="downloads">—</span>
      </div>

    </div>


    <!-- Live Monitoring -->

    <div class="live">

      <span class="live-dot"></span>

      LIVE MONITORING ACTIVE

    </div>


    <!-- Latest Event -->

    <div class="event-box">

      <div class="event-title">
        LATEST SECURITY EVENT
      </div>

      <div
        id="latestEvent"
        class="event"
      >
        Waiting for activity...
      </div>

    </div>


    <!-- Warning -->

    <div
      id="warning"
      class="warning hidden"
    >

      <div class="warning-title">
        ⚠ SECURITY WARNING
      </div>

      <div
        id="warningText"
        class="warning-text"
      >
      </div>

    </div>


    <!-- Dashboard Button -->

    <button
      id="openDashboard"
      class="dashboard-btn"
      type="button"
    >
      🌐 Open SITEDitto Dashboard
    </button>


    <!-- Footer -->

    <div class="footer">
      SITEDitto • Continuous Security Monitoring
    </div>

  </div>


  <!-- JavaScript -->

  <script src="popup.js"></script>

</body>

</html>
